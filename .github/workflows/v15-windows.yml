name: V15 Windows Build

on:
  push:
    branches: [master]
    tags: ['v0.2.0-alpha.v15.1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx --no-install tsx --test --test-concurrency=1 $(find src resources -name '*.test.ts')

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build V15 overlay
        run: npm run build

      - name: Package NSIS and portable
        run: npx --no-install electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-desktop-v15-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Prepare V15.1 release notes and checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          $portable = Get-ChildItem release\*.exe | Where-Object { $_.Name -notmatch '-setup\.exe$' } | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw 'Expected setup and portable executables were not found.' }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLower()
          @(
            "$setupHash  $($setup.Name)"
            "$portableHash  $($portable.Name)"
          ) | Set-Content -Encoding ascii release\SHA256SUMS.txt
          @"
          ## Pi Desktop Mod V15.1 — Windows x64

          Unofficial Apache-2.0 fork of Pi Desktop with an OMP-first clean default.

          Highlights:
          - OMP model discovery and protocol-v2 recovery for oversized model rosters.
          - Capability-aware thinking/effort controls.
          - Local OMP usage diagnostics, kept separate from provider billing/account totals.
          - Clean downstream setup: install the app, then configure your own providers/accounts.
          - No maintainer provider credentials, user sessions, recovery data, private local models, or private native speech acceleration are bundled.
          - Full maintainer-sanitized UI screenshots are published in the repository without additional cropping.

          Windows assets:
          - $($setup.Name) — SHA256: $setupHash
          - $($portable.Name) — SHA256: $portableHash

          This is a prerelease. The Windows installer is NSIS .exe (not MSI).
          "@ | Set-Content -Encoding utf8 release\RELEASE_NOTES.md

      - name: Publish V15.1 prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release\*.exe | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release\SHA256SUMS.txt).Path
          gh release create "$env:GITHUB_REF_NAME" $assets --repo "$env:GITHUB_REPOSITORY" --title "Pi Desktop Mod V15.1 — Windows x64" --notes-file release\RELEASE_NOTES.md --prerelease --verify-tag
